[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-lightrag"
version = "0.1.0"
description = "Agentic RAG system based on LightRAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "openai>=2.37.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.47.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_lightrag"]
